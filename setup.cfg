[metadata]
name = uefusion
version = 0.1.0
description = Output-level RAN-Core cooperation for future UE position prediction
long_description = file: README.md
long_description_content_type = text/markdown
author = Taeheum Na and Taeyeon Kim
license = MIT
license_files = LICENSE, DATA_LICENSE
url = https://github.com/Yosbee/uncertainty-aware-multidomain-fusion-ue-position

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    numpy>=1.26,<2
    scipy>=1.11
    pandas>=2
    scikit-learn==1.7.0
    torch>=2.2,<3

[options.packages.find]
where = src

[options.extras_require]
test = pytest>=8

[options.entry_points]
console_scripts =
    uefusion = uefusion.cli:main
